# FilsPay stack: Postgres, the three services that talk to it directly
# (apps/api, apps/settlement, apps/reporting), and an nginx `proxy` that
# serves apps/web + apps/admin and forwards /v1 to the api. The proxy is the
# only service published to the outside; everything else is reachable only
# on the compose network.
#
# Secrets and per-host settings come from ops/.env (gitignored), which
# compose reads for ${...} interpolation. Create it with ops/gen-env.sh.
# Shared non-secret service settings come from ops/.env.docker via env_file.
#
# Deploy / run from the repo root: ops/deploy.sh (see ops/README.md).

x-database-url: &database-url postgres://filspay:${POSTGRES_PASSWORD:?run ops/gen-env.sh}@postgres:5432/filspay?sslmode=disable

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: filspay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ops/gen-env.sh}
      POSTGRES_DB: filspay
    # Loopback only: reachable for psql on the box, never from the internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - filspay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filspay -d filspay"]
      interval: 2s
      timeout: 3s
      retries: 20

  # One-off: applies db/migrations/*.sql, then exits. Safe to re-run; the
  # runner skips what schema_migrations says is already applied. In the
  # `setup` profile so `up` never starts it implicitly.
  migrate:
    # Built by the api service (one image for all four Node services).
    image: filspay/node:local
    pull_policy: never
    profiles: ["setup"]
    command: ["npm", "run", "migrate"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  # One-off: deterministic seed data. db/seed/index.ts TRUNCATEs and
  # regenerates on every run, so it is only ever run explicitly
  # (ops/deploy.sh --seed), never as part of `up`.
  seed:
    # Built by the api service (one image for all four Node services).
    image: filspay/node:local
    pull_policy: never
    profiles: ["setup"]
    command: ["npm", "run", "seed"]
    environment:
      DATABASE_URL: *database-url
      # The seed calls the api's loadConfig(); the built-in dev fallback key
      # decodes to 34 bytes and fails validation, so pass the real one.
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:?run ops/gen-env.sh}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: filspay/node:local
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    restart: unless-stopped
    command: ["npx", "tsx", "apps/api/src/index.ts"]
    env_file: .env.docker
    environment:
      DATABASE_URL: *database-url
      SETTLEMENT_INTERNAL_URL: http://settlement:8091
      SETTLEMENT_INTERNAL_TOKEN: ${SETTLEMENT_INTERNAL_TOKEN:?run ops/gen-env.sh}
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:?run ops/gen-env.sh}
      ACQUIRER_CALLBACK_SIGNING_SECRET: ${ACQUIRER_CALLBACK_SIGNING_SECRET:?run ops/gen-env.sh}
      # Payment-link URLs are built from this; it's the proxy's public URL.
      CHECKOUT_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      # Secure cookies are dropped by browsers over plain http. Set true in
      # ops/.env once the public URL is https.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # No email/SMS provider is wired, so with NODE_ENV=production nobody can
      # receive an OTP. Demo hosts set this true in ops/.env: the login
      # response carries the code and both login pages display it.
      OTP_DEV_EXPOSE: ${OTP_DEV_EXPOSE:-false}
      NODE_OPTIONS: --max-old-space-size=384
    volumes:
      - filspay_kyc:/app/data/kyc
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy

  settlement:
    build:
      context: ..
      dockerfile: ops/Dockerfile.go
    restart: unless-stopped
    command: ["./settlement", "daemon"]
    environment:
      # Note: PGCONN_SETTLEMENT, if set, *overrides* DATABASE_URL
      # (internal/config/config.go), so it is deliberately not set here.
      DATABASE_URL: *database-url
      # The daemon exits at boot without it; must match the api's value.
      SETTLEMENT_INTERNAL_TOKEN: ${SETTLEMENT_INTERNAL_TOKEN:?run ops/gen-env.sh}
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy

  reporting:
    # Built by the api service (one image for all four Node services).
    image: filspay/node:local
    pull_policy: never
    restart: unless-stopped
    # No subcommand = `worker`.
    command: ["npx", "tsx", "apps/reporting/src/index.ts"]
    environment:
      DATABASE_URL: *database-url
      NODE_OPTIONS: --max-old-space-size=192
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy

  proxy:
    build:
      context: ..
      dockerfile: ops/Dockerfile.web
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    mem_limit: 64m
    depends_on:
      - api

volumes:
  filspay_pgdata:
  filspay_kyc:
