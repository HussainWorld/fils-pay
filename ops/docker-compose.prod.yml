# Production stack for the hosted box (Dilmune Cloud). Self-contained: does
# NOT extend docker-compose.yml, because the dev file publishes Postgres on
# 5432 with a password that is committed to git, and hard-codes secrets.
#
#   cp ops/prod.env.example ops/.env.prod      # fill in real secrets
#   docker compose -f ops/docker-compose.prod.yml --env-file ops/.env.prod up -d --build
#   docker compose -f ops/docker-compose.prod.yml --env-file ops/.env.prod --profile seed run --rm seed   # optional demo data
#
# Public ports: 80 = merchant dashboard + checkout + /v1 API, 8081 = admin console.
# Postgres, settlement and reporting are reachable only on the internal network.

# Own project name: without it this file and the dev docker-compose.yml are
# both project "ops" and share the volume ops_filspay_pgdata, so a database
# created by the dev stack (different password) breaks the prod migrate job.
name: filspay-prod

x-db-url: &db-url postgres://filspay:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/filspay?sslmode=disable

x-node-build: &node-build
  context: ..
  dockerfile: ops/Dockerfile.node

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: *db-url
  SETTLEMENT_INTERNAL_URL: http://settlement:8091
  SETTLEMENT_INTERNAL_TOKEN: ${SETTLEMENT_INTERNAL_TOKEN:?set SETTLEMENT_INTERNAL_TOKEN}
  WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:?set WEBHOOK_SECRET_ENCRYPTION_KEY}
  ACQUIRER_CALLBACK_SIGNING_SECRET: ${ACQUIRER_CALLBACK_SIGNING_SECRET:?set ACQUIRER_CALLBACK_SIGNING_SECRET}
  ACQUIRER_CALLBACK_REQUIRE_SIGNATURE: "true"
  # Secure cookies need HTTPS. Set COOKIE_SECURE=false ONLY while the box is
  # served over plain http (no TLS in front), or logins will not stick.
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  # There is no email/SMS sender wired up yet, so in production nobody can
  # receive a login OTP. For a local run or a demo, OTP_DEV_EXPOSE=true shows
  # the code on the login screen. Never leave this on for real users.
  OTP_DEV_EXPOSE: ${OTP_DEV_EXPOSE:-false}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: filspay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: filspay
    # no `ports:` on purpose: the database is never exposed outside the box
    volumes:
      - filspay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filspay -d filspay"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: *node-build
    image: filspay-node
    command: ["npm", "run", "migrate"]
    environment: { DATABASE_URL: *db-url }
    depends_on:
      postgres: { condition: service_healthy }

  seed:
    profiles: ["seed"]
    build: *node-build
    image: filspay-node
    command: ["npm", "run", "seed"]
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }

  api:
    build: *node-build
    image: filspay-node
    restart: unless-stopped
    command: ["npx", "tsx", "apps/api/src/index.ts"]
    environment: *app-env
    mem_limit: 512m
    depends_on:
      migrate: { condition: service_completed_successfully }

  settlement:
    build: { context: .., dockerfile: ops/Dockerfile.go }
    restart: unless-stopped
    command: ["./settlement", "daemon"]
    environment:
      DATABASE_URL: *db-url
      SETTLEMENT_INTERNAL_TOKEN: ${SETTLEMENT_INTERNAL_TOKEN:?set SETTLEMENT_INTERNAL_TOKEN}
    depends_on:
      migrate: { condition: service_completed_successfully }

  reporting:
    build: *node-build
    image: filspay-node
    restart: unless-stopped
    command: ["npx", "tsx", "apps/reporting/src/index.ts"]
    environment: { DATABASE_URL: *db-url }
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: .., dockerfile: ops/Dockerfile.web }
    restart: unless-stopped
    ports:
      - "80:80"
      - "8081:8081"
    depends_on: [api]

volumes:
  filspay_pgdata:
