server {
    listen 80;
    server_name _;

    # KYC uploads (KYC_MAX_FILE_SIZE_BYTES defaults to 8 MiB) and CSV imports.
    client_max_body_size 10m;

    root /usr/share/nginx/html;

    # FIX D-9: same-origin proxy — the api has no CORS handling and the frontends use cookie auth.
    location /v1/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Admin-triggered settlement runs go through the API to the
        # settlement worker and can take a while.
        proxy_read_timeout 300s;
    }

    location = /healthz { proxy_pass http://api:3000; }
    location = /readyz  { proxy_pass http://api:3000; }

    location = /admin { return 301 /admin/; }
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
