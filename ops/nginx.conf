# :80   merchant dashboard + hosted checkout + public API (/v1, /healthz, /readyz)
# :8081 admin console (+ the same API, which the console calls under /v1/admin)
upstream filspay_api { server api:3000; }

map $http_upgrade $connection_upgrade { default upgrade; "" close; }

server {
    listen 80;
    client_max_body_size 10m;           # KYC uploads are capped at 8 MiB by the API
    root /usr/share/nginx/web;

    location /v1/ {
        proxy_pass http://filspay_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;             # stream large CSV exports
        proxy_read_timeout 120s;
    }
    location ~ ^/(healthz|readyz)$ { proxy_pass http://filspay_api; }
    location / { try_files $uri /index.html; }
}

server {
    listen 8081;
    client_max_body_size 2m;
    root /usr/share/nginx/admin;

    location /v1/ {
        proxy_pass http://filspay_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { try_files $uri /index.html; }
}
